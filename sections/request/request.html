<section class="request section" id="request">
  <div class="container request__grid">
    <div>
      <p class="eyebrow">Следующий шаг</p>
      <h2>Обсудим рост<br /><em>вашего производства</em></h2>
      <p class="request__lead">
        Расскажите, что сейчас мешает продажам и сколько задач остаётся на собственнике. Определим следующий шаг.
      </p>
      <div class="request__meeting">
        <span>Стратегическая встреча</span><strong>30 минут · онлайн</strong>
        <p>Платная встреча. Стоимость и время согласуем до записи.</p>
      </div>
    </div>
    <form class="request__form" data-request-form>
      <p class="request__caption">Начнём со знакомства</p>
      <label
        >Как к вам обращаться<input
          name="name"
          autocomplete="name"
          required
          minlength="2"
          maxlength="100"
          placeholder="Ваше имя" /></label
      ><label
        >Номер телефона<input
          type="tel"
          name="contact"
          autocomplete="tel"
          inputmode="tel"
          required
          minlength="18"
          placeholder="+7 (000) 000-00-00"
          aria-describedby="phone-hint"
      /></label>
      <label
        >Что хотите изменить? <span>Необязательно</span
        ><textarea
          name="message"
          rows="2"
          maxlength="3000"
          placeholder="Пара слов о вашей задаче"
        ></textarea></label
      ><label class="request__consent"
        ><input type="checkbox" required name="consent" /><span
          >Согласен(на) на обработку персональных данных.
          <a href="{{root}}politika/">Условия обработки</a></span
        ></label
      ><button class="button button-request" type="submit">Подготовить обращение</button>

      <p class="request__status" role="status" aria-live="polite"></p>
      <textarea
        class="request__output"
        data-request-output
        readonly
        hidden
        rows="5"
        aria-label="Подготовленное обращение"
      ></textarea
      ><button class="text-link" data-copy type="button" hidden>
        Скопировать обращение
      </button>
    </form>
  </div>
</section>
