<section class="hero hero--atelier" aria-labelledby="hero-title">
  <div class="hero-atelier__arch" aria-hidden="true"></div>
  <div class="hero-atelier__copy">
    <p class="eyebrow">Система продаж для производственного бизнеса</p>
    <h1 id="hero-title">Продажи <span class="hero-em"><span class="hero-em__word">для</span> <span class="hero-em__word">роста</span></span> производства</h1>
    <p class="hero-atelier__intro">Разгружаем собственника и собираем систему продаж</p>
    <a class="button" href="{{root}}kontakty/#request">Обсудить задачу</a>
  </div>
  <picture class="hero-atelier__portrait hero-atelier__portrait--left">

    <img src="{{root}}img/team/hero-portraits-neutral.png" width="1534" height="1025" alt="Елена — эксперт proДАВАТЬ">
  </picture>
  <picture class="hero-atelier__portrait hero-atelier__portrait--right">

    <img src="{{root}}img/team/hero-portraits-neutral.png" width="1534" height="1025" alt="Анастасия — эксперт proДАВАТЬ">
  </picture>

  <picture class="hero-atelier__duo">
    <source media="(max-width:1100px)" srcset="{{root}}img/team/hero-team-cutout.webp">
    <img src="{{root}}img/transparent.svg" width="1408" height="1117" alt="Елена и Анастасия — команда proДАВАТЬ">
  </picture>
  <div class="hero-atelier__wordmark" role="region" aria-label="Логотип proДАВАТЬ">
    <div class="hero-atelier__conveyor" aria-hidden="true"></div>
  </div>
</section>
